services:
  hr-hub-db:
    image: postgres:16-alpine
    container_name: hr-hub-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hr_hub
      POSTGRES_PASSWORD: hr_hub
      POSTGRES_DB: hr_hub
    volumes:
      - hr_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_hub -d hr_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hr_hub_pgdata:
