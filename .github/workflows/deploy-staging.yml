name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch/tag/SHA)
        required: false
        default: staging
      skip_migrations:
        description: Skip database migrations
        required: false
        type: boolean
        default: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Deploy backend (Railway staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "RAILWAY_TOKEN yoki RAILWAY_SERVICE_ID yo'q — staging backend deploy qilinmadi."
            echo "Echo bilan yashil hisoblanmaydi. Secretlar qo'yilguncha workflow yiqiladi."
            exit 1
          fi
          echo "Token bor, lekin bu workflow hali haqiqiy railway up chaqirmaydi."
          echo "Noto'g'ri service ga yuklash xavfli. Deploy skripti alohida ulanadi."
          exit 1

      - name: Deploy frontend (Railway staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_FRONTEND_SERVICE_ID: ${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_FRONTEND_SERVICE_ID" ]; then
            echo "RAILWAY_TOKEN yoki RAILWAY_FRONTEND_SERVICE_ID yo'q — staging frontend deploy qilinmadi."
            exit 1
          fi
          echo "Token bor, lekin frontend railway up hali ulanmagan."
          exit 1

      - name: Run migrations
        if: ${{ !inputs.skip_migrations }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL yo'q — migratsiya o'tkazib yuborilmadi, workflow yiqildi."
            exit 1
          fi
          cd backend
          npm ci
          npx prisma migrate deploy

      - name: Smoke check
        env:
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
        run: |
          if [ -z "$STAGING_HEALTH_URL" ]; then
            echo "STAGING_HEALTH_URL yo'q — smoke tekshiruvsiz yashil bo'lib bo'lmaydi."
            exit 1
          fi
          curl -sf "$STAGING_HEALTH_URL" | head -c 500

      - name: Rollback hint
        if: failure()
        run: |
          echo "Rollback: redeploy previous Railway release or run backup:pre-release checklist"
