# Emulyator + Docker + WSL: commit limit (errno 1455) — heap/daemon ni kamaytiramiz.
# MaxMetaspace 256m assembleRelease da OOM berdi — biroz oshirildi.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=64m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx384m
android.useAndroidX=true
android.overridePathCheck=true
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# R8 full mode Gson TypeToken generic signature ni olib tashlaydi
# (flutter_local_notifications cancel → crash → sync «Noma'lum xato»).
android.enableR8.fullMode=false
